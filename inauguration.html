
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grand Inauguration</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="css/event-pages.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f8f3e8;
            font-family: Georgia, serif;
            color: #5d321d;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 30px 20px 45px;
            background:
                radial-gradient(circle at top left, #ead29b55, transparent 30%),
                radial-gradient(circle at bottom right, #d5a85c44, transparent 30%);
        }

        .container-main {
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
        }

        /* Main Heading */
        .heading {
            width: 100%;
            text-align: center;
            margin: 0 auto 35px;
        }

        .heading h1 {
            margin: 0;
            font-size: clamp(36px, 6vw, 75px);
            font-weight: bold;
            line-height: 1.1;
            text-transform: uppercase;
            text-align: center;
        }

        .heading .line {
            width: 80px;
            height: 3px;
            background: #c99b3d;
            margin: 15px auto 0;
        }

        /* Guest Section */
        .guest-section {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(180px, 0.8fr) minmax(0, 1fr);
            align-items: center;
            justify-content: center;
            gap: 24px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .guest-box {
            width: 100%;
            max-width: 390px;
            margin: 0 auto;
            padding: 8px;
            background: #fff;
            border: 1px solid #dfc88d;
            border-radius: 18px;
            box-shadow: 0 12px 35px #5d321d20;
            text-align: center;
        }

        .guest-box img {
            display: block;
            width: 100%;
            height: 360px;
            object-fit: cover;
            object-position: center;
            border-radius: 13px;
        }

        .guest-name {
            padding: 12px 5px 3px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .guest-name + .guest-name {
            padding-top: 3px;
            padding-bottom: 8px;
            color: #8c6b4a;
            font-size: 12px;
        }

        /* Center Text */
        .center-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            text-align: center;
            padding: 20px 5px;
        }

        .center-text h2 {
            margin: 0 0 12px;
            color: #813d1c;
            font-size: clamp(27px, 3vw, 40px);
            font-weight: bold;
            line-height: 1.2;
            text-align: center;
        }

        .center-text p {
            margin: 0;
            color: #8c6b4a;
            font-family: Arial, sans-serif;
            font-size: 13px;
            text-align: center;
        }

        /* Gallery */
        .gallery {
            width: 100%;
            max-width: 1100px;
            margin: 45px auto 0;
        }

        .gallery .row {
            justify-content: center;
            align-items: stretch;
        }

        .photo {
            width: 100%;
            height: 250px;
            overflow: hidden;
            border: 5px solid #fff;
            border-radius: 15px;
            box-shadow: 0 8px 25px #5d321d20;
        }

        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.4s ease;
        }

        .photo:hover img {
            transform: scale(1.05);
        }

        /* Moderate Entrance Animation */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heading,
        .guest-box,
        .center-text,
        .gallery {
            animation: fadeUp 0.65s ease both;
        }

        .guest-box:nth-child(1) {
            animation-delay: 0.1s;
        }

        .center-text {
            animation-delay: 0.2s;
        }

        .guest-box:nth-child(3) {
            animation-delay: 0.3s;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Tablet */
        @media (max-width: 991px) {
            .page {
                padding: 25px 18px 35px;
            }

            .guest-section {
                grid-template-columns: minmax(0, 1fr) minmax(140px, 0.7fr) minmax(0, 1fr);
                gap: 14px;
            }

            .guest-box img {
                height: 290px;
            }

            .guest-name {
                font-size: 12px;
            }

            .guest-name + .guest-name {
                font-size: 11px;
            }

            .photo {
                height: 220px;
            }
        }

        /* Mobile */
        @media (max-width: 767px) {
            .page {
                padding: 22px 14px 30px;
            }

            .heading {
                margin-bottom: 28px;
            }

            .guest-section {
                grid-template-columns: minmax(0, 1fr);
                gap: 22px;
            }

            .guest-box {
                max-width: 420px;
            }

            .guest-box img {
                height: 320px;
            }

            .center-text {
                padding: 8px 0;
            }

            .center-text h2 {
                font-size: 32px;
            }

            .gallery {
                margin-top: 32px;
            }

            .gallery .row {
                --bs-gutter-x: 12px;
                --bs-gutter-y: 12px;
            }

            .photo {
                height: 200px;
                border-width: 4px;
            }
        }

        /* Small Mobile */
        @media (max-width: 400px) {
            .page {
                padding: 20px 10px 25px;
            }

            .heading h1 {
                font-size: 34px;
            }

            .guest-box img {
                height: 270px;
            }

            .guest-name {
                font-size: 12px;
            }

            .center-text h2 {
                font-size: 28px;
            }

            .photo {
                height: 155px;
                border-width: 3px;
                border-radius: 10px;
            }
        }

        html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0 !important;
    padding: 0 !important;
}

body.event-page {

    min-height: 100vh;

    margin: 0 auto !important;

    left: auto !important;

    transform: none !important;
}

.guest-section,
.gallery,
.heading {
    margin-left: auto !important;
    margin-right: auto !important;
}

img {
    max-width: 100%;
}
    </style>
</head>

</html>
