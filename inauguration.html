<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grand Inauguration</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f8f3e8;
            font-family: Georgia, serif;
            color: #5d321d;
        }

        .page {
            min-height: 100vh;
            padding: 30px 20px 45px;
            background:
                radial-gradient(circle at top left, #ead29b55, transparent 30%),
                radial-gradient(circle at bottom right, #d5a85c44, transparent 30%);
        }

        .container-main {
            max-width: 1250px;
            margin: auto;
        }

        /* Heading */
        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading small {
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            color: #a66a27;
        }

        .heading h1 {
            margin: 8px 0 0;
            font-size: clamp(42px, 6vw, 75px);
            font-weight: bold;
            line-height: 1;
            text-transform: uppercase;
        }

        .heading .line {
            width: 80px;
            height: 3px;
            background: #c99b3d;
            margin: 15px auto 0;
        }

        /* Guest Section */
        .guest-box {
            background: #fff;
            padding: 8px;
            border-radius: 18px;
            box-shadow: 0 12px 35px #5d321d20;
            border: 1px solid #dfc88d;
        }

        .guest-box img {
            width: 100%;
            height: 390px;
            object-fit: cover;
            border-radius: 13px;
            display: block;
        }

        .guest-name {
            text-align: center;
            padding: 12px 5px 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            font-weight: 600;
        }

        /* Center */
        .center-text {
            text-align: center;
            padding: 20px;
        }

        .center-text h2 {
            font-size: 34px;
            margin-bottom: 8px;
            color: #813d1c;
        }

        .center-text p {
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #8c6b4a;
            margin: 0;
        }

        /* Gallery */
        .gallery {
            margin-top: 40px;
        }

        .photo {
            height: 250px;
            overflow: hidden;
            border-radius: 15px;
            border: 5px solid #fff;
            box-shadow: 0 8px 25px #5d321d20;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: .4s ease;
        }

        .photo:hover img {
            transform: scale(1.06);
        }

        @media (max-width: 991px) {
            .guest-box img {
                height: 330px;
            }

            .center-text {
                padding: 5px;
            }
        }

        @media (max-width: 575px) {
            .page {
                padding: 20px 12px 30px;
            }

            .guest-box img {
                height: 300px;
            }

            .photo {
                height: 190px;
            }

            .center-text h2 {
                font-size: 28px;
            }
        }
    </style>
    <link rel="stylesheet" href="css/event-pages.css">
</head>

<body class="event-page event-inauguration">

<div class="page">

    <div class="container-main">

        <!-- Small Heading -->
        <div class="heading">

            <h1>Inauguration</h1>

            <div class="line"></div>
        </div>


        <!-- 2 Guest Photos -->
        <div class="row g-4 align-items-center">

            <!-- Guest 1 -->
            <div class="col-lg-4 col-md-5">
                <div class="guest-box">

                    <!-- PHOTO 1 -->
                    <img src="assets/guest-1.jpg" alt="Guest 1">

                    <div class="guest-name">
                            KUVAR MANVENDRA SINGH
                     </div>


                     
                    <div class="guest-name">
                        VIDHAN PARISHAD SABHAPATI
                      </div>
                </div>
            </div>


            <!-- Center Text -->
            <div class="col-lg-4 col-md-2">
                <div class="center-text">

                    <h2>Grand<br>Inauguration</h2>

                    <p>
                        A New Beginning
                    </p>

                </div>
            </div>


            <!-- Guest 2 -->
            <div class="col-lg-4 col-md-5">
                <div class="guest-box">

                    <!-- PHOTO 2 -->
                    <img src="assets/guest-2.jpg" alt="Guest 2">

                    <div class="guest-name">
                        Upendra Nath Pasvan
                    </div>

                    
                    <div class="guest-name">
                        BJP GRAMIN JILA ADHYAKSH
                    </div>

                </div>
            </div>

        </div>


        <!-- 6 Program Photos -->
        <div class="gallery">

            <div class="row g-3">

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-1.jpg" alt="Program Photo 1">
                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-2.jpg" alt="Program Photo 2">
                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-3.jpg" alt="Program Photo 3">
                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-4.jpg" alt="Program Photo 4">
                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-5.jpg" alt="Program Photo 5">
                    </div>
                </div>

                <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-6.jpg" alt="Program Photo 6">
                    </div>
                </div>

                 <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-7.jpg" alt="Program Photo 6">
                    </div>
                </div>

                 <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-8.jpg" alt="Program Photo 6">
                    </div>
                </div>

                 <div class="col-6 col-lg-4">
                    <div class="photo">
                        <img src="assets/program-9.jpg" alt="Program Photo 6">
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
