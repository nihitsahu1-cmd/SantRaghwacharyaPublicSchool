<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mango Party</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            background: #fff9ed;
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 1200px;
            margin: auto;
            padding: 35px 15px 50px;
        }

        /* Heading */
        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            margin: 0;
            color: #d88900;
            font-size: clamp(38px, 6vw, 65px);
            font-weight: 800;
        }

        .heading p {
            margin-top: 7px;
            color: #8b7048;
            font-size: 14px;
        }

        /* Main Big Photo */
        .big-photo {
            width: 100%;
            height: 580px;
            overflow: hidden;
            border-radius: 22px;
            border: 6px solid #fff;
            box-shadow: 0 12px 35px rgba(100, 65, 10, .18);
            margin-bottom: 18px;
        }

        .big-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: .5s ease;
        }

        .big-photo:hover img {
            transform: scale(1.04);
        }

        /* Small Photos */
        .photo {
            height: 260px;
            overflow: hidden;
            border-radius: 18px;
            border: 5px solid #fff;
            box-shadow: 0 8px 25px rgba(100, 65, 10, .15);
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: .5s ease;
        }

        .photo:hover img {
            transform: scale(1.06);
        }

        @media (max-width: 767px) {

            .page {
                padding: 25px 12px 35px;
            }

            .big-photo {
                height: 320px;
            }

            .photo {
                height: 190px;
            }
        }
    </style>
    <link rel="stylesheet" href="css/event-pages.css">
</head>

<body class="event-page event-mango">

<div class="page">

    <!-- Heading -->
    <div class="heading">
        <h1>🥭 Mango Party</h1>
        <p>A Fun Day Full of Smiles & Sweet Memories</p>
    </div>


    <!-- BIG PHOTO -->
    <div class="big-photo">
        <img src="assets/mango-1.jpg" alt="Mango Party">
    </div>


    <!-- 5 OTHER PHOTOS -->
    <div class="row g-3">

        <div class="col-6">
            <div class="photo">
                <img src="assets/mango-2.jpg" alt="Mango Party">
            </div>
        </div>

        <div class="col-6">
            <div class="photo">
                <img src="assets/mango-3.jpg" alt="Mango Party">
            </div>
        </div>

        <div class="col-6">
            <div class="photo">
                <img src="assets/mango-4.jpg" alt="Mango Party">
            </div>
        </div>

        <div class="col-6">
            <div class="photo">
                <img src="assets/mango-5.jpg" alt="Mango Party">
            </div>
        </div>


    </div>

</div>

</body>
</html>
